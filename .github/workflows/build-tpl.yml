name: TTE-TPL-builds

on:
  workflow_dispatch:

# Allow this workflow to push updates back to the fork
permissions:
  contents: write

# Prevent two TPL-build workflows from running at the same time on the same branch
concurrency:
  group: tpl-build-${{ github.ref_name }}
  cancel-in-progress: false


jobs:
  prepare-source:
    name: Prepare latest TPL source
    runs-on: pine
    timeout-minutes: 20

    env:
      UPSTREAM_URL: https://github.com/GEOS-DEV/thirdPartyLibs.git
      UPSTREAM_BRANCH: master

    outputs:
      tpl_sha: ${{ steps.update-source.outputs.tpl_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Update for latest source
        run: |
          set -euo pipefail

          git lfs install --local
          git fetch "${UPSTREAM_URL}" "${UPSTREAM_BRANCH}"

          TPL_SHA="$(git rev-parse --short FETCH_HEAD)"
          
          git merge --no-edit FETCH_HEAD

          git lfs pull
          git submodule update --init --recursive

          echo "Upstream SHA: ${TPL_SHA}"
          echo "tpl_sha=${TPL_SHA}" >> "$GITHUB_OUTPUT"
          
    
