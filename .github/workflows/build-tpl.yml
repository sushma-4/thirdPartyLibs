name: Build_pine_aocc

on:
  workflow_dispatch:

jobs:
  build-TPLs:
    name: Build-TPLs-pine-aocc
    runs-on: pine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show basic runner information
        run: |
          echo "Hello from the cluster runner"
          echo "Hostname:"
          hostname

          echo "Current directory:"
          pwd

          echo "Git commit:"
          git rev-parse HEAD

          echo "UTC date:"
          date -u +"%Y-%m-%dT%H:%M:%SZ"

      - name: Check Slurm access
        run: |
          echo "Checking Slurm commands..."
          which sbatch || true
          which sacct || true
          which squeue || true
