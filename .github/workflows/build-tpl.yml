name: TTE-TPL-builds

on:
  workflow_dispatch:

# Allow this workflow to push updates back to the fork
permissions:
  contents: write

# Prevent two TPL-build workflows from running at the same time on the same branch
concurrency:
  group: tpl-build-${{ github.ref_name }}
  cancel-in-progress: false


jobs:
  prepare-source:
    name: Prepare latest TPL source
    runs-on: pine
    timeout-minutes: 20

    env:
      UPSTREAM_URL: https://github.com/GEOS-DEV/thirdPartyLibs.git
      UPSTREAM_BRANCH: master

    outputs:
      prepared_sha: ${{ steps.sync-with-upstream.outputs.prepared_sha }}
      upstream_sha: ${{ steps.sync-with-upstream.outputs.upstream_sha }}
      upstream_short_sha: ${{ steps.sync-with-upstream.outputs.upstream_short_sha }}
      build_date: ${{ steps.sync-with-upstream.outputs.build_date }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Sync with upstream
        id: sync-with-upstream
        run: |
          set -euo pipefail

          git lfs install --local
          git fetch "${UPSTREAM_URL}" "${UPSTREAM_BRANCH}"

          UPSTREAM_SHA="$(git rev-parse FETCH_HEAD)"
          UPSTREAM_SHORT_SHA="$(git rev-parse --short FETCH_HEAD)"

          git merge --no-edit FETCH_HEAD
          PREPARED_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          git lfs pull
          git submodule update --init --recursive

          echo "~~~~~~~~~~ Upstream SHA: ${UPSTREAM_SHA}"
          echo "~~~~~~~~~~ Prepared SHA: ${PREPARED_SHA}"
          
          echo "prepared_sha=${PREPARED_SHA}" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
          echo "upstream_short_sha=${UPSTREAM_SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          
  build-tpl:
    name: Build TPL ${{ matrix.platform }}-${{ matrix.compiler }}
    needs: prepare-source
    runs-on: [pine]
    timeout-minutes: 90

    strategy:
      matrix:
        platform: [pine,turin]
        compiler: [aocc,gcc]

    steps:
      - name: Checkout prepared source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-source.outputs.prepared_sha }}
          fetch-depth: 0
          lfs: true
          submodules: true


      - name: Build-TPL job
        run: |
          set -euo pipefail

          PLATFORM="${{ matrix.platform }}"
          COMPILER="${{ matrix.compiler }}"
          BUILD_DATE="${{ needs.prepare-source.outputs.build_date }}"
          TPL_SHA="${{ needs.prepare-source.outputs.upstream_short_sha }}"

          BASE_INSTALL_DIR="/home/svcgeoscicd/installations"
          LOG_DIR="/home/svcgeoscicd/installations/LOGS"

          mkdir -p "${BASE_INSTALL_DIR}/${PLATFORM}/${COMPILER}/tpl_install/${BUILD_DATE}_${TPL_SHA}"

          chmod +x ci/slurm/tpl-${PLATFORM}-${COMPILER}.sbatch

          set +e
          JOBID=$(sbatch --wait --parsable --output "${LOG_DIR}/gha-tpl-build-%j.out" --error "${LOG_DIR}/gha-tpl-build-%j.err" ci/slurm/tpl-"${PLATFORM}"-"${COMPILER}".sbatch "${PLATFORM}" "${COMPILER}" "${BUILD_DATE}" "${TPL_SHA}")
          RC=$?
          set -e

          echo "~~~~~~~~~~ Submitted job with ID: ${JOBID}"
          echo "~~~~~~~~~~ Slurm sbatch exit code: ${RC}"

          if [ "${RC}" -ne 0 ]; then
            echo "Error: sbatch command failed with exit code ${RC}"
            rm -rf "${BASE_INSTALL_DIR}/${PLATFORM}/${COMPILER}/tpl_install/${BUILD_DATE}_${TPL_SHA}"
            exit 1
          fi

          cp ./*.cmake "${BASE_INSTALL_DIR}/${PLATFORM}/${COMPILER}/tpl_install/${BUILD_DATE}_${TPL_SHA}"

      - name : Update links
        run: |
          set -euo pipefail

          PLATFORM="${{ matrix.platform }}"
          COMPILER="${{ matrix.compiler }}"
          BUILD_DATE="${{ needs.prepare-source.outputs.build_date }}"
          TPL_SHA="${{ needs.prepare-source.outputs.upstream_short_sha }}"

          BASE_INSTALL_DIR="/home/svcgeoscicd/installations"
          TPL_DIR="${BASE_INSTALL_DIR}/${PLATFORM}/${COMPILER}/tpl_install"

          # Remove the old build that 'latest' points to, then point 'latest' to the new build
          if [ -L "${TPL_DIR}/latest" ]; then
            rm -rf "$(readlink "${TPL_DIR}/latest")"
          fi

          ln -sfn "${TPL_DIR}/${BUILD_DATE}_${TPL_SHA}" "${TPL_DIR}/latest"

          echo "~~~~~~~~~~ Updated 'latest' link in ${TPL_DIR} -> ${BUILD_DATE}_${TPL_SHA}"
