name: TTE-TPL-builds

on:
  workflow_dispatch:

# Allow this workflow to push updates back to the fork
permissions:
  contents: write

# Prevent two TPL-build workflows from running at the same time on the same branch
concurrency:
  group: tpl-build-${{ github.ref_name }}
  cancel-in-progress: false


jobs:
  prepare-source:
    name: Prepare latest TPL source
    runs-on: pine
    timeout-minutes: 20

    env:
      UPSTREAM_URL: https://github.com/GEOS-DEV/thirdPartyLibs.git
      UPSTREAM_BRANCH: master

    outputs:
      upstream_sha: ${{ steps.sync-with-upstream.outputs.upstream_sha }}
      upstream_short_sha: ${{ steps.sync-with-upstream.outputs.upstream_short_sha }}
      build_date: ${{ steps.sync-with-upstream.outputs.build_date }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Sync with upstream
        id: sync-with-upstream
        run: |
          set -euo pipefail

          git lfs install --local
          git fetch "${UPSTREAM_URL}" "${UPSTREAM_BRANCH}"

          UPSTREAM_SHA="$(git rev-parse FETCH_HEAD)"
          UPSTREAM_SHORT_SHA="$(git rev-parse --short FETCH_HEAD)"

          git merge --no-edit FETCH_HEAD

          git lfs pull
          git submodule update --init --recursive

          echo "~~~~~~~~~~ Upstream SHA: ${UPSTREAM_SHA}"
          
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
          echo "upstream_short_sha=${UPSTREAM_SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          
  build-tpl:
    name: Build TPL pine-aocc
    needs: prepare-source
    runs-on: [pine]
    timeout-minutes: 90

    steps:
      - name: Checkout prepared source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-source.outputs.upstream_sha }}
          fetch-depth: 0
          lfs: true
          submodules: true

      - name: Confirm prepared source
        run: |
          set -euo pipefail

          EXPECTED_SHA="${{ needs.prepare-source.outputs.upstream_sha }}"
          ACTUAL_SHA=$(git rev-parse HEAD)

          if [[ "${ACTUAL_SHA}" == "${EXPECTED_SHA}" ]]; then
            echo "~~~~~~~~~~  OK -- building with expected source SHA: ${EXPECTED_SHA}"
          else
            echo "~~~~~~~~~~ error: expected ${EXPECTED_SHA}, got ${ACTUAL_SHA}"
            exit 1
          fi

      - name: Build TPL
        run: |
          set -euo pipefail

          PLATFORM="pine"
          COMPILER="aocc"
          BUILD_DATE="${{ needs.prepare-source.outputs.build_date }}"
          TPL_SHA="${{ needs.prepare-source.outputs.upstream_short_sha }}"

          BASE_INSTALL_DIR="/home/svcgeoscicd/installations"
          LOG_DIR="/home/svcgeoscicd/installations/LOGS"

          mkdir -p "${BASE_INSTALL_DIR}/${PLATFORM}/${COMPILER}/tpl_install/${BUILD_DATE}_${TPL_SHA}"

          chmod +x ci/slurm/tpl-pine-aocc.sbatch
          JOBID=$(sbatch ci/slurm/tpl-pine-aocc.sbatch "${PLATFORM}" "${COMPILER}" "${BUILD_DATE}" "${TPL_SHA}" "${LOG_DIR}")
          
          echo "Submitted job with ID: ${JOBID}"

          
